<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Jumping Park &middot; Product Tour</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #0b1220;
        color: #f4f6fb;
        font-family: sans-serif;
      }
      .stage-img {
        position: absolute;
        inset: 96px 96px 128px;
        max-width: calc(100% - 192px);
        max-height: calc(100% - 224px);
        margin: auto;
        object-fit: contain;
        border-radius: 12px;
        box-shadow: 0 30px 80px rgba(0, 0, 0, 0.45);
        background: #ffffff;
      }
      .title-strip {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        padding: 36px 96px;
      }
      .title-pill {
        display: inline-flex;
        align-items: baseline;
        gap: 18px;
        padding: 12px 20px;
        background: #0b1220;
        border: 1px solid #2a3a5c;
        border-radius: 12px;
      }
      .title-eyebrow {
        font-size: 18px;
        font-weight: 600;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: #f4f6fb;
      }
      .title-text {
        font-size: 34px;
        font-weight: 700;
        color: #f4f6fb;
        line-height: 1.2;
      }
      .outro {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        text-align: center;
        padding: 0 160px;
      }
      .outro h2 {
        font-size: 44px;
        font-weight: 700;
        color: #f4f6fb;
      }
      .outro p {
        font-size: 22px;
        color: #f4f6fb;
        max-width: 880px;
        line-height: 1.45;
      }
      .outro .badge {
        display: inline-block;
        margin-top: 12px;
        padding: 8px 18px;
        border: 1px solid #2a3a5c;
        border-radius: 999px;
        font-size: 16px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #f4f6fb;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="jp-tour"
      data-start="0"
      data-duration="78"
      data-width="1920"
      data-height="1080"
    >
      <img
        id="scene-kiosk"
        class="clip stage-img"
        src="assets/kiosk-ingreso.png"
        alt="Pantalla de ingreso del kiosco"
        data-start="0"
        data-duration="10.5"
        data-track-index="1"
        style="z-index: 1;"
      />
      <div
        id="title-kiosk"
        class="clip title-strip"
        data-start="0.4"
        data-duration="9.6"
        data-track-index="8"
        style="z-index: 8;"
      >
        <div class="title-pill">
          <span class="title-eyebrow">1/7</span>
          <span class="title-text">Kiosco &middot; Ingreso</span>
        </div>
      </div>

      <img
        id="scene-kiosk-otp"
        class="clip stage-img"
        src="assets/kiosk-otp.png"
        alt="Pantalla de verificacion OTP del kiosco"
        data-start="10.5"
        data-duration="10.5"
        data-track-index="2"
        style="z-index: 2;"
      />
      <div
        id="title-kiosk-otp"
        class="clip title-strip"
        data-start="10.9"
        data-duration="9.6"
        data-track-index="9"
        style="z-index: 9;"
      >
        <div class="title-pill">
          <span class="title-eyebrow">2/7</span>
          <span class="title-text">OTP Verification</span>
        </div>
      </div>

      <img
        id="scene-kiosk-consent"
        class="clip stage-img"
        src="assets/kiosk-consentimiento.png"
        alt="Pantalla de consentimiento digital del kiosco"
        data-start="21.0"
        data-duration="10.5"
        data-track-index="3"
        style="z-index: 3;"
      />
      <div
        id="title-kiosk-consent"
        class="clip title-strip"
        data-start="21.4"
        data-duration="9.6"
        data-track-index="10"
        style="z-index: 10;"
      >
        <div class="title-pill">
          <span class="title-eyebrow">3/7</span>
          <span class="title-text">Digital Consent</span>
        </div>
      </div>

      <img
        id="scene-kiosk-offline"
        class="clip stage-img"
        src="assets/kiosk-offline-success.png"
        alt="Pantalla de exito offline del kiosco"
        data-start="31.5"
        data-duration="10.5"
        data-track-index="4"
        style="z-index: 4;"
      />
      <div
        id="title-kiosk-offline"
        class="clip title-strip"
        data-start="31.9"
        data-duration="9.6"
        data-track-index="11"
        style="z-index: 11;"
      >
        <div class="title-pill">
          <span class="title-eyebrow">4/7</span>
          <span class="title-text">Offline Success</span>
        </div>
      </div>

      <img
        id="scene-admin-dash"
        class="clip stage-img"
        src="assets/admin-dashboard.png"
        alt="Dashboard del panel de administracion"
        data-start="42.0"
        data-duration="10.5"
        data-track-index="5"
        style="z-index: 5;"
      />
      <div
        id="title-admin-dash"
        class="clip title-strip"
        data-start="42.4"
        data-duration="9.6"
        data-track-index="12"
        style="z-index: 12;"
      >
        <div class="title-pill">
          <span class="title-eyebrow">5/7</span>
          <span class="title-text">Admin Dashboard</span>
        </div>
      </div>

      <img
        id="scene-admin-consents"
        class="clip stage-img"
        src="assets/admin-consents-list.png"
        alt="Lista de consentimientos en el panel de administracion"
        data-start="52.5"
        data-duration="10.5"
        data-track-index="6"
        style="z-index: 6;"
      />
      <div
        id="title-admin-consents"
        class="clip title-strip"
        data-start="52.9"
        data-duration="9.6"
        data-track-index="13"
        style="z-index: 13;"
      >
        <div class="title-pill">
          <span class="title-eyebrow">6/7</span>
          <span class="title-text">Consent Records</span>
        </div>
      </div>

      <img
        id="scene-public"
        class="clip stage-img"
        src="assets/public-consentimiento-digital.png"
        alt="Pagina publica de consentimiento digital"
        data-start="63.0"
        data-duration="10.5"
        data-track-index="7"
        style="z-index: 7;"
      />
      <div
        id="title-public"
        class="clip title-strip"
        data-start="63.4"
        data-duration="9.6"
        data-track-index="14"
        style="z-index: 14;"
      >
        <div class="title-pill">
          <span class="title-eyebrow">7/7</span>
          <span class="title-text">Public Consent</span>
        </div>
      </div>

      <div
        id="outro-card"
        class="clip outro"
        data-start="73.5"
        data-duration="4.5"
        data-track-index="15"
        style="z-index: 15;"
      >
        <h2>Jumping Park &middot; Product Tour</h2>
        <p>7 scenes from real screenshots</p>
        <span class="badge">Real product screenshots &middot; Not a render</span>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      tl.from("#title-kiosk", { y: -16, opacity: 0, duration: 0.6, ease: "power2.out" }, 0.4);

      tl.from("#scene-kiosk-otp", { opacity: 0, duration: 0.6, ease: "power2.out" }, 10.5);
      tl.from("#title-kiosk-otp", { y: -16, opacity: 0, duration: 0.6, ease: "power2.out" }, 10.9);

      tl.from("#scene-kiosk-consent", { opacity: 0, duration: 0.6, ease: "power2.out" }, 21.0);
      tl.from("#title-kiosk-consent", { y: -16, opacity: 0, duration: 0.6, ease: "power2.out" }, 21.4);

      tl.from("#scene-kiosk-offline", { opacity: 0, duration: 0.6, ease: "power2.out" }, 31.5);
      tl.from("#title-kiosk-offline", { y: -16, opacity: 0, duration: 0.6, ease: "power2.out" }, 31.9);

      tl.from("#scene-admin-dash", { opacity: 0, duration: 0.6, ease: "power2.out" }, 42.0);
      tl.from("#title-admin-dash", { y: -16, opacity: 0, duration: 0.6, ease: "power2.out" }, 42.4);

      tl.from("#scene-admin-consents", { opacity: 0, duration: 0.6, ease: "power2.out" }, 52.5);
      tl.from("#title-admin-consents", { y: -16, opacity: 0, duration: 0.6, ease: "power2.out" }, 52.9);

      tl.from("#scene-public", { opacity: 0, duration: 0.6, ease: "power2.out" }, 63.0);
      tl.from("#title-public", { y: -16, opacity: 0, duration: 0.6, ease: "power2.out" }, 63.4);

      tl.to("#scene-public", { opacity: 0, duration: 0.5, ease: "power2.in" }, 73.5);
      tl.to("#title-public", { opacity: 0, duration: 0.5, ease: "power2.in" }, 73.5);
      tl.from("#outro-card", { opacity: 0, y: 12, duration: 0.6, ease: "power2.out" }, 74.0);

      window.__timelines["jp-tour"] = tl;
    </script>
  </body>
</html>
