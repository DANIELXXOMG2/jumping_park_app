name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Format, lint, types, tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ADMIN_JWT_SECRET: ci-admin-secret
      ADMIN_SESSION_MODE: dual
      ADMIN_IDLE_TIMEOUT_MINUTES: "30"
      OTP_LOCKOUT_MINUTES: "15"
      OTP_HARDENING_ENABLED: "true"
      EXPORT_BOUNDS_ENFORCED: "true"
      PUBLIC_SEO_ENABLED: "true"
      CURSOR_PAGINATION_ENABLED: "false"
      ADMIN_AGGREGATES_ENABLED: "false"
      OFFLINE_QUEUE_ENABLED: "false"
      NEXT_PUBLIC_OFFLINE_QUEUE_ENABLED: "false"
      CSP_REPORT_ONLY_ENABLED: "false"
      RESEND_API_KEY: re_ci_placeholder
      FIREBASE_PROJECT_ID: ci-placeholder
      FIREBASE_CLIENT_EMAIL: ci@example.com
      FIREBASE_PRIVATE_KEY: "-----BEGIN PRIVATE KEY-----\nci\n-----END PRIVATE KEY-----\n"
      FIREBASE_STORAGE_BUCKET: ci-placeholder.appspot.com
      NEXT_PUBLIC_FIREBASE_API_KEY: ci-placeholder
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ci-placeholder.firebaseapp.com
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: ci-placeholder
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ci-placeholder.appspot.com
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "000000000000"
      NEXT_PUBLIC_FIREBASE_APP_ID: "1:000000000000:web:ci"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run static quality checks
        run: bun run check

      - name: Run production-readiness artifact parity proof
        run: bun test tests/phase4-production-artifacts.test.ts

      - name: Run tests
        run: bun test

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Audit direct runtime dependencies
        shell: bash
        run: |
          set +e
          bun audit > audit-output.txt 2>&1
          audit_status=$?
          cat audit-output.txt

          {
            echo "## Dependency audit"
            if grep -q "(direct dependency)" audit-output.txt; then
              echo "- Blocking: direct dependency vulnerabilities were reported by bun audit."
            elif [ "$audit_status" -ne 0 ]; then
              echo "- Non-blocking: only transitive/tooling vulnerabilities remain. See docs/runbooks/dependency-risk-note.md."
            else
              echo "- Clean audit: no vulnerabilities reported."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if grep -q "(direct dependency)" audit-output.txt; then
            exit 1
          fi

  build-verification:
    name: Build verification
    runs-on: ubuntu-latest
    needs:
      - quality
      - dependency-audit
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_FIREBASE_API_KEY: ci-placeholder
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ci-placeholder.firebaseapp.com
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: ci-placeholder
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ci-placeholder.appspot.com
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "000000000000"
      NEXT_PUBLIC_FIREBASE_APP_ID: "1:000000000000:web:ci"
      FIREBASE_PROJECT_ID: ci-placeholder
      FIREBASE_CLIENT_EMAIL: ci@example.com
      FIREBASE_STORAGE_BUCKET: ci-placeholder.appspot.com
      RESEND_API_KEY: re_ci_placeholder
      ADMIN_JWT_SECRET: ci-admin-secret
      ADMIN_SESSION_MODE: dual
      ADMIN_IDLE_TIMEOUT_MINUTES: "30"
      OTP_LOCKOUT_MINUTES: "15"
      ALLOW_ADMIN_SETUP: "false"
      ADMIN_SECRET_KEY: ci-secret
      PUBLIC_SEO_ENABLED: "true"
      CURSOR_PAGINATION_ENABLED: "false"
      ADMIN_AGGREGATES_ENABLED: "false"
      OFFLINE_QUEUE_ENABLED: "false"
      NEXT_PUBLIC_OFFLINE_QUEUE_ENABLED: "false"
      CSP_REPORT_ONLY_ENABLED: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify production build
        run: bun run build
