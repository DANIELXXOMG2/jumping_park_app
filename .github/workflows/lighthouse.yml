name: Lighthouse CI

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

concurrency:
  group: lighthouse-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse:
    name: Lighthouse CI audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_FIREBASE_API_KEY: ci-placeholder
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ci-placeholder.firebaseapp.com
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: ci-placeholder
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ci-placeholder.appspot.com
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "000000000000"
      NEXT_PUBLIC_FIREBASE_APP_ID: "1:000000000000:web:ci"
      ADMIN_SESSION_MODE: dual
      ADMIN_IDLE_TIMEOUT_MINUTES: "30"
      OTP_LOCKOUT_MINUTES: "15"
      ALLOW_ADMIN_SETUP: "false"
      OTP_HARDENING_ENABLED: "true"
      EXPORT_BOUNDS_ENFORCED: "true"
      PUBLIC_SEO_ENABLED: "true"
      CURSOR_PAGINATION_ENABLED: "false"
      ADMIN_AGGREGATES_ENABLED: "false"
      OFFLINE_QUEUE_ENABLED: "false"
      NEXT_PUBLIC_OFFLINE_QUEUE_ENABLED: "false"
      CSP_REPORT_ONLY_ENABLED: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Prepare Lighthouse CI secrets and Firebase placeholders
        shell: bash
        run: |
          admin_jwt_secret="$(openssl rand -hex 32)"
          admin_secret_key="$(openssl rand -hex 32)"
          resend_api_key="re_ci_placeholder"
          firebase_project_id="ci-placeholder"
          firebase_client_email="ci@example.com"
          firebase_storage_bucket="ci-placeholder.appspot.com"
          firebase_private_key="$(bun -e "const { generateKeyPairSync } = require('node:crypto'); const { privateKey } = generateKeyPairSync('rsa', { modulusLength: 2048 }); process.stdout.write(privateKey.export({ type: 'pkcs8', format: 'pem' }));")"

          echo "::add-mask::$admin_jwt_secret"
          echo "::add-mask::$admin_secret_key"
          echo "::add-mask::$resend_api_key"
          echo "::add-mask::$firebase_private_key"
          while IFS= read -r private_key_line; do
            if [ -n "$private_key_line" ]; then
              echo "::add-mask::$private_key_line"
            fi
          done <<< "$firebase_private_key"

          echo "ADMIN_JWT_SECRET=$admin_jwt_secret" >> "$GITHUB_ENV"
          echo "ADMIN_SECRET_KEY=$admin_secret_key" >> "$GITHUB_ENV"
          echo "RESEND_API_KEY=$resend_api_key" >> "$GITHUB_ENV"
          echo "FIREBASE_PROJECT_ID=$firebase_project_id" >> "$GITHUB_ENV"
          echo "FIREBASE_CLIENT_EMAIL=$firebase_client_email" >> "$GITHUB_ENV"
          echo "FIREBASE_STORAGE_BUCKET=$firebase_storage_bucket" >> "$GITHUB_ENV"
          {
            echo 'FIREBASE_PRIVATE_KEY<<EOF'
            printf '%s\n' "$firebase_private_key"
            echo 'EOF'
          } >> "$GITHUB_ENV"

      - name: Build app for Lighthouse
        run: bun run build

      - name: Run Lighthouse CI
        run: bun x lhci autorun --config=./lighthouserc.json

      - name: Upload Lighthouse reports artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: .lighthouseci
          if-no-files-found: ignore
